<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="400" height="160" role="img" aria-label="Healthy weight range">
  <title>Healthy weight range</title>
  <desc>A band showing a healthy weight range for a given height, with the target zone highlighted.</desc>
  <rect x="0" y="20" width="400" height="24" rx="12" fill="#e5e7eb"/>
  <rect x="120" y="20" width="160" height="24" rx="12" fill="#14b88a" opacity="0.9"/>
  <rect x="0" y="20" width="120" height="24" rx="12" fill="#cbd5e1"/>
  <rect x="280" y="20" width="120" height="24" rx="12" fill="#cbd5e1"/>
  <line x1="200" y1="52" x2="200" y2="70" stroke="#14b88a" stroke-width="3" stroke-linecap="round"/>
  <circle cx="200" cy="76" r="7" fill="#14b88a"/>
  <text x="200" y="94" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#064e3b" text-anchor="middle">Healthy weight range</text>
  <text x="200" y="120" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Based on your height and a target BMI of 18.5–24.9</text>
  <text x="60" y="37" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Below range</text>
  <text x="340" y="37" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Above range</text>
</svg>