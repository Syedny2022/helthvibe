<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200" role="img" aria-label="Privacy-first">
  <title>Privacy-first calculations</title>
  <desc>A browser window with a closed padlock, showing that no data leaves the device.</desc>
  <rect x="40" y="20" width="320" height="150" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="40" y="20" width="320" height="34" rx="18" fill="#f1f5f9"/>
  <rect x="40" y="36" width="320" height="18" fill="#f1f5f9"/>
  <circle cx="80" cy="31" r="5" fill="#cbd5e1"/>
  <circle cx="100" cy="31" r="5" fill="#cbd5e1"/>
  <circle cx="120" cy="31" r="5" fill="#cbd5e1"/>
  <g transform="translate(150,60)">
    <rect x="0" y="14" width="100" height="64" rx="10" fill="#ecfdf5" stroke="#14b88a" stroke-width="2"/>
    <path d="M38 14 V34 a22 22 0 0 0 44 0 V14" fill="none" stroke="#14b88a" stroke-width="6" stroke-linecap="round"/>
    <circle cx="58" cy="60" r="7" fill="#14b88a"/>
  </g>
  <text x="200" y="150" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#064e3b" text-anchor="middle">Your data never leaves your browser</text>
  <text x="200" y="172" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">No server. No tracking. No signup.</text>
</svg>