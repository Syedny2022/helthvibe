name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type and template check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Internal link audit
        run: npm run links:check

      - name: Verify generated images are committed
        run: |
          test -f public/og-default.png
          test -f public/logo.png
          test -f public/apple-touch-icon.png
